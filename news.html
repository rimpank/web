<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Update</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-blue-600 tracking-tight">BlogModern</a>
            <nav class="space-x-6 hidden sm:flex">
                <a href="#" class="text-gray-600 hover:text-blue-600 transition">Home</a>
                <a href="#" class="text-gray-600 hover:text-blue-600 transition">Tentang</a>
                <a href="#" class="text-gray-600 hover:text-blue-600 transition">Kontak</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight sm:text-5xl">Artikel Terbaru</h1>
            <p class="mt-3 text-lg text-gray-500">Kumpulan tulisan dan tutorial yang diperbarui secara otomatis.</p>
        </div>

        <!-- Grid Container untuk Daftar Ringkasan Artikel -->
        <div id="blog-content" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
            <!-- Efek Loading Statis -->
            <div class="animate-pulse bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="h-48 bg-gray-200 rounded-xl mb-4"></div>
                <div class="h-6 bg-gray-200 rounded w-3/4 mb-2"></div>
                <div class="h-4 bg-gray-200 rounded w-full mb-2"></div>
                <div class="h-4 bg-gray-200 rounded w-5/6"></div>
            </div>
        </div>
    </main>

    <!-- JavaScript Penghubung -->
    <script>
        // GANTI URL DI BAWAH INI DENGAN URL BLOGSPOT ANDA
        const blogURL = "https://blog.rimpang.my.id"; 
        
        // Mengambil 6 artikel terbaru dalam format JSON
        const apiURL = `${blogURL}/feeds/posts/default?alt=json&max-results=6`;

        fetch(apiURL)
            .then(response => response.json())
            .then(data => {
                const entries = data.feed.entry || [];
                let output = "";
                
                if (entries.length === 0) {
                    document.getElementById("blog-content").innerHTML = `<p class="col-span-full text-center text-gray-500">Belum ada artikel yang diterbitkan.</p>`;
                    return;
                }

                entries.forEach(entry => {
                    const title = entry.title.\$t;
                    const postUrl = entry.link.find(l => l.rel === 'alternate').href;
                    
                    // Format Tanggal
                    const publishedDate = new Date(entry.published.\$t).toLocaleDateString('id-ID', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    // Mengambil Ringkasan Konten (Snippet)
                    // Menggunakan summary.\$t jika ada, atau memotong konten asli agar bersih dari tag HTML
                    let snippet = "";
                    if (entry.summary) {
                        snippet = entry.summary.\$t;
                    } else if (entry.content) {
                        snippet = entry.content.\$t.replace(/<[^>]*>/g, ''); // Hapus kode HTML
                    }
                    snippet = snippet.substring(0, 120) + "..."; // Batasi hingga 120 karakter

                    // Mengambil Gambar Utama (Thumbnail)
                    let thumbnailUrl = "https://unsplash.com"; // Gambar default jika artikel tidak ada gambar
                    if (entry.media\$thumbnail) {
                        // Mengubah ukuran thumbnail default Blogspot (s72-c) menjadi lebih besar/tajam (s400)
                        thumbnailUrl = entry.media\$thumbnail.url.replace('/s72-c/', '/s400/');
                    } else if (entry.content && entry.content.\$t.includes('<img')) {
                        // Jika tidak ada thumbnail resmi tetapi ada gambar di dalam artikel
                        const imgTag = entry.content.\$t.match(/<img[^>]+src="([^">]+)"/);
                        if (imgTag && imgTag[1]) thumbnailUrl = imgTag[1];
                    }

                    // Kerangka HTML Card (Tailwind)
                    output += `
                        <article class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition duration-300 flex flex-col">
                            <div class="h-48 overflow-hidden bg-gray-100">
                                <img src="${thumbnailUrl}" alt="${title}" class="w-full h-full object-cover hover:scale-105 transition duration-500" loading="lazy">
                            </div>
                            <div class="p-6 flex flex-col flex-grow">
                                <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-2">${publishedDate}</span>
                                <h2 class="text-xl font-bold text-gray-900 line-clamp-2 hover:text-blue-600 transition mb-3">
                                    <a href="${postUrl}" target="_blank">${title}</a>
                                </h2>
                                <p class="text-gray-600 text-sm line-clamp-3 mb-6 flex-grow">${snippet}</p>
                                <div class="mt-auto">
                                    <a href="${postUrl}" target="_blank" class="inline-flex items-center text-sm font-semibold text-blue-600 hover:text-blue-700">
                                        Baca Selengkapnya
                                        <svg class="w-4 h-4 ml-1 transform hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="String9 5l7 7-7 7"></path></svg>
                                    </a>
                                </div>
                            </div>
                        </article>
                    `;
                });
                
                document.getElementById("blog-content").innerHTML = output;
            })
            .catch(error => {
                console.error("Error fetching Blogger feed:", error);
                document.getElementById("blog-content").innerHTML = `
                    <p class="col-span-full text-center text-red-500 font-medium">
                        Gagal memuat artikel. Pastikan URL blog sudah benar dan pengaturan feed Blogspot Anda aktif.
                    </p>`;
            });
    </script>
</body>
</html>
